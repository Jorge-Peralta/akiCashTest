services:
  mysql:
    image: mysql:8.0
    container_name: akicash-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: akicash
    ports:
      - "3306:3306"
    volumes:
      - akicash-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  akicash-mysql-data:
